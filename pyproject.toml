[project]
name = "drive-pipeline"
version = "0.1.0"
description = "Personal AI Memory OS — RAG pipeline over Google Drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Google Drive + Gemini
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
    "google-genai>=1.0",
    # Local embeddings
    "sentence-transformers>=3.0",
    # Vector DB
    "chromadb>=0.5",
    # Text extraction
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # API server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Web / HTML fetching
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    # File watcher
    "watchdog>=4.0",
    # Utilities
    "python-dotenv>=1.0",
    "gradio>=4",
]

[project.scripts]
drive-pipeline = "main:main"

[tool.uv]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: tests that require external services or fixture files"]
